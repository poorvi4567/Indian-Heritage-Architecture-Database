{% extends 'base.html' %}

{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <!-- Optional: Use a larger logo or heading for context since nav is gone -->
        <h1 style="font-size: 1.8rem; color: var(--saffron); margin-bottom: 20px;">🏛️ Indian Heritage</h1>
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join us to explore India's Heritage</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn btn-auth">Sign Up</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
